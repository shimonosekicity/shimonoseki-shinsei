<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下関市 申請書作成サービス</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a3a5c;
      color: white;
      padding: 24px;
      text-align: center;
    }
    header .logo {
      font-size: 0.85rem;
      opacity: 0.75;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      opacity: 0.8;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .lead {
      text-align: center;
      margin-bottom: 36px;
    }
    .lead h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
    }
    .lead p {
      font-size: 0.875rem;
      color: #718096;
    }
    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 680px;
    }
    .card {
      flex: 1;
      min-width: 260px;
      max-width: 310px;
      background: white;
      border-radius: 16px;
      padding: 32px 28px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 2px solid transparent;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .card.teijuu { border-color: #1a56a0; }
    .card.teijuu:hover { border-color: #1a56a0; }
    .card.shussan { border-color: #276749; }
    .card.shussan:hover { border-color: #276749; }
    .card-icon {
      font-size: 2.4rem;
      line-height: 1;
    }
    .card-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.05em;
      width: fit-content;
    }
    .teijuu .card-badge { background: #ebf4ff; color: #1a56a0; }
    .shussan .card-badge { background: #f0fff4; color: #276749; }
    .card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .teijuu h3 { color: #1a3a5c; }
    .shussan h3 { color: #1a3a2c; }
    .card p {
      font-size: 0.82rem;
      color: #718096;
      line-height: 1.6;
    }
    .card-btn {
      margin-top: auto;
      padding: 11px 0;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.03em;
    }
    .teijuu .card-btn { background: #1a56a0; color: white; }
    .shussan .card-btn { background: #276749; color: white; }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.78rem;
      color: #a0aec0;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">下関市人口定住促進対策事業</div>
  <h1>申請書作成サービス</h1>
  <p>必要事項を入力するだけで、申請書Wordファイルを自動生成します</p>
</header>

<main>
  <div class="lead">
    <h2>作成する申請書を選んでください</h2>
    <p>各カードをタップして入力フォームへ進みます</p>
  </div>

  <div class="cards">

    <a href="/teijuu" class="card teijuu">
      <div class="card-icon">🏠</div>
      <div class="card-badge">定住支援</div>
      <h3>定住奨励金<br>支給申請書</h3>
      <p>市外から下関市に転入し、定住された方が対象の奨励金申請書を作成します。</p>
      <div class="card-btn">申請書を作成する →</div>
    </a>

    <a href="/shussan" class="card shussan">
      <div class="card-icon">👶</div>
      <div class="card-badge">子育て支援</div>
      <h3>出産祝い金<br>支給申請書</h3>
      <p>下関市でお子さんが生まれた方が対象の出産祝い金申請書を作成します。</p>
      <div class="card-btn">申請書を作成する →</div>
    </a>

  </div>
</main>

<footer>
  このサービスは申請書の作成を補助するものです。内容は必ずご確認の上、各担当窓口へ提出してください。
</footer>

</body>
</html>
