<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}下関市 申請書作成サービス{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>:root { --accent: {% block accent %}#1a56a0{% endblock %}; }</style>
</head>
<body>

<header>
  <h1>{% block header_title %}{% endblock %}</h1>
  <p>{% block header_sub %}{% endblock %}</p>
</header>

<div class="container">
  <a href="/" class="back-btn">← 申請書の選択に戻る</a>
  {% block content %}{% endblock %}
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
